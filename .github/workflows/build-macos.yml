
name: Build New-Gocron for macOS ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build macOS ARM64 binaries
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath \
            -o dist/gocron ./cmd/gocron

          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath \
            -o dist/gocron-node ./cmd/node

      - name: Verify binaries
        run: |
          file dist/gocron dist/gocron-node
          ./dist/gocron --help
          ./dist/gocron-node --help

      - name: Package
        shell: bash
        run: |
          mkdir -p package/bin
          cp dist/gocron dist/gocron-node package/bin/
          cp -R conf package/ 2>/dev/null || true

          tar -czf New-Gocron-macos-arm64.tar.gz \
            -C package .

          shasum -a 256 New-Gocron-macos-arm64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: New-Gocron-macos-arm64
          path: New-Gocron-macos-arm64.tar.gz
          retention-days: 30
