
name: Build New-Gocron for macOS ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build macOS ARM64 binaries
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath \
            -o dist/gocron ./cmd/gocron

          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 \
            go build -trimpath \
            -o dist/gocron-node ./cmd/node

      - name: Verify macOS ARM64 binaries
        shell: bash
        run: |
          set -euo pipefail

          file dist/gocron dist/gocron-node

          file dist/gocron | grep -q 'Mach-O 64-bit arm64'
          file dist/gocron-node | grep -q 'Mach-O 64-bit arm64'

          test -s dist/gocron
          test -s dist/gocron-node

          echo "macOS ARM64 binaries verified successfully"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p package/bin
          cp dist/gocron dist/gocron-node package/bin/

          if [ -d conf ]; then
            cp -R conf package/
          fi

          tar -czf New-Gocron-macos-arm64.tar.gz \
            -C package .

          shasum -a 256 New-Gocron-macos-arm64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: New-Gocron-macos-arm64
          path: New-Gocron-macos-arm64.tar.gz
          retention-days: 30
